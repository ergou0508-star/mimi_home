<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211d28">
<title>咪咪的小窝</title>
<style>
:root{
  --page:#211d28; --panel:#2b2532; --bubble:#39313f; --pink:#f9e7f0;
  --muted:#bbaebe; --accent:#b98bab; --mine:#75556f; --line:#4b414f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page);color:var(--pink)}
button,input,textarea{font:inherit}
.app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--page);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bubble);font-size:25px;flex:none}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.identity{min-width:0;flex:1}
.name{font-weight:700;font-size:16px;letter-spacing:.02em}
.status{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn{border:0;background:transparent;color:var(--pink);font-size:22px;padding:8px;cursor:pointer;border-radius:12px}
.iconbtn:active,.send:active{transform:scale(.97)}
.chat{flex:1;overflow-y:auto;padding:18px 12px 22px;scroll-behavior:smooth}
.dayline{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 22px}
.group{display:flex;align-items:flex-start;gap:8px;margin:0 0 17px}
.group .avatar{width:34px;height:34px;font-size:20px;margin-top:1px}
.messages{display:flex;flex-direction:column;gap:7px;align-items:flex-start;max-width:min(82%,520px)}
.bubble{background:var(--bubble);color:var(--pink);padding:11px 13px;border-radius:16px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.mine{display:flex;justify-content:flex-end;margin:0 0 17px}
.mine .bubble{background:var(--mine);max-width:min(82%,520px);border-bottom-right-radius:5px}
.group .bubble:first-child{border-top-left-radius:5px}
.composer-wrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.composer{display:flex;align-items:flex-end;gap:8px}
#message{flex:1;min-width:0;resize:none;max-height:120px;border:1px solid var(--line);outline:none;background:var(--bubble);color:var(--pink);border-radius:18px;padding:12px 14px;line-height:1.4}
#message::placeholder{color:var(--muted)}
#message:focus{border-color:var(--accent)}
.send{width:44px;height:44px;border:0;border-radius:15px;background:var(--accent);color:white;font-size:20px;cursor:pointer;flex:none}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:7px}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#4b414f;color:var(--pink);padding:10px 14px;border-radius:14px;font-size:13px;display:none;max-width:90%;z-index:5}
@media(min-width:600px){body{padding:18px 0}.app{height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:22px;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="avatar" id="headerAvatar">
  <img src="mimi2.jpg" alt="咪咪" />
    </div>
    <div class="identity">
      <div class="name" id="headerName">咪咪</div>
      <div class="status">一只住在手机里的小猫</div>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="设置" title="设置">⋯</button>
  </header>
  <main class="chat" id="chat" aria-live="polite">
    <div class="dayline">今天也来找小猫玩啦</div>
  </main>
  <footer class="composer-wrap">
    <form class="composer" id="composer">
      <textarea id="message" rows="1" placeholder="给咪咪发消息……" aria-label="消息内容"></textarea>
      <button class="send" type="submit" aria-label="发送">➤</button>
    </form>
    <div class="hint">这是前端小窝 · 暂时不会连接 AI</div>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const STORAGE_KEY = 'mimi-cat-chat-v1';
  const SETTINGS_KEY = 'mimi-cat-settings-v1';
  const chat = document.getElementById('chat');
  const form = document.getElementById('composer');
  const input = document.getElementById('message');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  let settings = {name:'咪咪', avatar:'🐈‍⬛'};
  let messages = [];
  const starter = [
    {role:'bot', text:'欧尼呀——！你终于来啦 😗'},
    {role:'user', text:'我来摸摸猫猫！'},
    {role:'bot', text:'喵！但是今天要多摸两下才行！'}
  ];
  try {
    settings = {...settings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')};
    const saved = localStorage.getItem(STORAGE_KEY);
    messages = saved ? JSON.parse(saved) : starter;
  } catch(e) { messages = starter; }
  document.getElementById('headerName').textContent = settings.name;
  document.getElementById('headerAvatar').innerHTML = '<img src="mimi2.jpg" alt="咪咪">';

  function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages)); } catch(e) { showToast('浏览器暂时无法保存记录'); } }
  function showToast(text){
    toastEl.textContent = text; toastEl.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.style.display='none', 2300);
  }
  function render(){
    chat.innerHTML = '<div class="dayline">今天也来找小猫玩啦</div>';
    let previousRole = null;
    messages.forEach((m) => {
      if(m.role === 'user'){
        const row = document.createElement('div'); row.className = 'mine';
        const bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent=m.text;
        row.appendChild(bubble); chat.appendChild(row);
      } else {
        const newGroup = previousRole !== 'bot';
        let row = newGroup ? document.createElement('div') : chat.lastElementChild;
        if(newGroup){
          row.className='group';
          const avatar=document.createElement('div');
avatar.className='avatar';
avatar.innerHTML='<img src="mimi2.jpg" alt="咪咪">';
avatar.setAttribute('aria-hidden','true');
          const list=document.createElement('div'); list.className='messages';
          row.appendChild(avatar); row.appendChild(list); chat.appendChild(row);
        }
        const list = row.querySelector('.messages');
        const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=m.text;
        list.appendChild(bubble);
      }
      previousRole = m.role;
    });
    if(!messages.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='这里还空空的，发一条消息吧。'; chat.appendChild(e); }
    chat.scrollTop=chat.scrollHeight;
  }
  function addMessage(role,text){ messages.push({role,text}); save(); render(); }
  form.addEventListener('submit',(e)=>{
    e.preventDefault(); const text=input.value.trim(); if(!text)return;
    addMessage('user',text); input.value=''; input.style.height='auto'; input.focus();
  });
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});
  input.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  document.getElementById('settingsBtn').addEventListener('click',()=>{
    const choice=prompt('输入 1 修改昵称，2 修改头像，3 清空聊天记录：\\n当前昵称：'+settings.name+'\\n当前头像：'+settings.avatar);
    if(choice==='1'){
      const name=prompt('给猫猫起个名字：',settings.name);
      if(name && name.trim()){settings.name=name.trim().slice(0,24);document.getElementById('headerName').textContent=settings.name;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));showToast('昵称改好啦！');}
    } else if(choice==='2'){
      showToast('咪咪现在使用专属图片头像啦！');
    } else if(choice==='3'){
      if(confirm('确定清空全部聊天记录吗？这个操作无法撤销。')){messages=[];save();render();showToast('聊天记录已清空。');}
    }
  });
  render();
})();
</script>
</body>
</html>
